spring:
  application:
    name: edu-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/edu_admin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 改成你自己的数据库密码
    password: 1234
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis:
  configuration:
    # 下划线转驼峰：dept_id -> deptId
    map-underscore-to-camel-case: true
    # 开发时打印 SQL，生产环境建议关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

# 阿里云 OSS 配置（换成你自己的，不填也不影响除上传外的功能）
aliyun:
  oss:
    endpoint: https://oss-cn-hangzhou.aliyuncs.com
    bucketName: your-bucket-name
    region: cn-hangzhou
